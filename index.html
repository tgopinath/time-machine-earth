<!doctype html>
<html lang="en" data-m3-primary="#9a6b34">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Time Machine Earth</title>
    <meta name="description" content="Travel through history: an interactive historical atlas from 3000 BCE to today." />
    <meta name="theme-color" content="#f6f1e6" />
    <!-- Native looks, only inside the app shells: Material 3 on Android, Apple HIG on iPhone. Inert in a browser.
         Inside an app shell (or with ?app=android|ios) the kits load render-blocking as before, so the native look is
         there on the first paint; in a normal browser, where they do nothing, they load in the background. -->
    <script>
      (function () {
        var b = 'https://tgopinath.github.io/kolam-design-system/', d = document, ua = navigator.userAgent;
        var g = function (k) { try { return sessionStorage.getItem(k) } catch (e) { return null } };
        var app = /[?&]app=(android|ios)\b/.test(location.search) || g('k-app-mode') === 'android' || g('kolam.app') === 'ios' || !!window.KolamShell ||
          /; wv\)|Kolam-iOS|-iOS\//.test(ua) || (/iPhone|iPad/.test(ua) && !/Safari\//.test(ua)) || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
        ['m3/kolam-m3', 'ios/kolam-ios'].forEach(function (f) {
          if (app) return d.write('<script src="' + b + f + '.js"><\/script><link rel="stylesheet" href="' + b + f + '.css">');
          var s = d.createElement('script'); s.src = b + f + '.js'; s.async = true; d.head.appendChild(s);
          var l = d.createElement('link'); l.rel = 'stylesheet'; l.href = b + f + '.css'; l.media = 'print'; l.onload = function () { this.media = 'all' }; d.head.appendChild(l);
        });
      })();
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
